# Apache do servidor (o mesmo do GLPI) -> NEXO Chat em Docker (127.0.0.1:8090).
#
# Módulos necessários:
#   Ubuntu/Debian: sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers ssl
#   Amazon Linux/RHEL: já vêm no httpd + mod_ssl (confira com: httpd -M | grep proxy)
#
# O HTTPS (porta 443) é criado pelo Certbot a partir deste bloco:
#   sudo certbot --apache -d chat.nexoti.com.br
<VirtualHost *:80>
    ServerName chat.nexoti.com.br

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 120

    RequestHeader set X-Forwarded-Proto "https" env=HTTPS
    RequestHeader set X-Forwarded-Proto "http" env=!HTTPS

    # WebSocket do Reverb (tempo real): conexões com "Upgrade: websocket".
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:8090/$1 [P,L]

    # Todo o resto (páginas, API do widget, arquivos).
    ProxyPass        / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/

    ErrorLog  ${APACHE_LOG_DIR}/chat.nexoti.com.br-error.log
    CustomLog ${APACHE_LOG_DIR}/chat.nexoti.com.br-access.log combined
</VirtualHost>
