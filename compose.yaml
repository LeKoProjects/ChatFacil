name: nexo-chat

x-php: &php
  build:
    context: .
    target: dev
  image: nexo-chat-php:dev
  user: "0:0"
  working_dir: /var/www/html
  volumes:
    - ./:/var/www/html
    # vendor/ fica no sistema de arquivos Linux do Docker: no Windows/macOS,
    # ler ~11 mil arquivos pela pasta compartilhada custava ~4 s por requisição.
    - vendor:/var/www/html/vendor
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [nexo]

services:
  app:
    <<: *php
    command: php-fpm -R
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - ./docker/php/fpm-dev.conf:/usr/local/etc/php-fpm.d/zz-dev.conf:ro

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app, reverb]
    networks: [nexo]

  reverb:
    <<: *php
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_PUBLIC_PORT:-8081}:8080"

  queue:
    <<: *php
    command: php artisan queue:work redis --tries=3 --sleep=1

  vite:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5174}:5173"
    volumes:
      - ./:/app
    networks: [nexo]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-nexo_chat}
      POSTGRES_USER: ${DB_USERNAME:-nexo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nexo} -d ${DB_DATABASE:-nexo_chat}"]
      interval: 5s
      retries: 10
    networks: [nexo]

  redis:
    image: redis:7-alpine
    ports:
      - "${FORWARD_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [nexo]

volumes:
  pgdata:
  vendor:

networks:
  nexo:
    name: nexo-net
    external: true
